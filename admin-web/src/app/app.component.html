<header class="barra">
  <a class="marca" routerLink="/home">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
      <path fill="currentColor"
            d="M20 3c-7.2 0-13 3.9-13 10.2 0 1.6.4 3 1.1 4.2L5 20.5 6.4 22l3.1-3.1c1.3.8 2.8 1.2 4.5 1.2C19.4 20 20 10.7 20 3Zm-6.9 14.1c-.9 0-1.7-.2-2.4-.5l6.5-6.5-1.4-1.4-6.5 6.5c-.3-.7-.5-1.5-.5-2.4C8.8 8.8 12.6 5.7 17.9 5.3c-.3 5.6-1.9 11.8-4.8 11.8Z"/>
    </svg>
    <span>Solidari</span>
  </a>

  <nav>
    <a routerLink="/home" routerLinkActive="ativo">Início</a>
    <a routerLink="/carteira" routerLinkActive="ativo">Carteira</a>
    <a routerLink="/admin" routerLinkActive="ativo">Parceiros</a>
  </nav>

  <div class="sessao">
    <a *ngIf="!auth.usuario()" class="btn-entrar" routerLink="/entrar">Entrar</a>

    <div *ngIf="auth.usuario() as u" class="usuario">
      <span class="inicial">{{ u.nome.charAt(0) }}</span>
      <span class="dados">
        <span class="nome">{{ u.nome }}</span>
        <span class="papel">{{ u.papel === 'ADMIN' ? 'Administrador' : 'Participante' }}</span>
      </span>
      <button type="button" class="btn-sair" (click)="sair()">Sair</button>
    </div>
  </div>
</header>

<main>
  <router-outlet></router-outlet>
</main>
