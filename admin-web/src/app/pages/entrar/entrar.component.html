<div class="pagina">
  <div class="cartao-login">
    <div class="topo">
      <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
        <path fill="currentColor"
              d="M20 3c-7.2 0-13 3.9-13 10.2 0 1.6.4 3 1.1 4.2L5 20.5 6.4 22l3.1-3.1c1.3.8 2.8 1.2 4.5 1.2C19.4 20 20 10.7 20 3Zm-6.9 14.1c-.9 0-1.7-.2-2.4-.5l6.5-6.5-1.4-1.4-6.5 6.5c-.3-.7-.5-1.5-.5-2.4C8.8 8.8 12.6 5.7 17.9 5.3c-.3 5.6-1.9 11.8-4.8 11.8Z"/>
      </svg>
      <h1>Bem-vindo de volta</h1>
      <p>Entre para acompanhar seu saldo e o impacto das suas doações.</p>
    </div>

    <p *ngIf="erro" class="aviso aviso-erro">{{ erro }}</p>

    <form (ngSubmit)="entrar()" #form="ngForm">
      <label>
        E-mail
        <input type="email" name="email" autocomplete="username"
               placeholder="voce@email.com" [(ngModel)]="email" required>
      </label>

      <label>
        Senha
        <input type="password" name="senha" autocomplete="current-password"
               placeholder="••••••••" [(ngModel)]="senha" required>
      </label>

      <button type="submit" class="btn-primario" [disabled]="form.invalid || enviando">
        {{ enviando ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <div class="contas-demo">
      <span class="titulo-demo">Contas de demonstração</span>
      <button type="button" class="conta" (click)="preencher('ana.rocha@email.com', 'senha123')">
        <span class="conta-nome">Ana Beatriz Rocha</span>
        <span class="conta-papel">Participante</span>
      </button>
      <button type="button" class="conta" (click)="preencher('admin@solidari.com', 'admin123')">
        <span class="conta-nome">Admin Solidari</span>
        <span class="conta-papel">Administrador</span>
      </button>
    </div>
  </div>
</div>
