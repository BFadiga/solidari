spring:
  datasource:
    url: jdbc:oracle:thin:@//${SOLIDARI_DB_HOST:localhost}:${SOLIDARI_DB_PORT:1521}/${SOLIDARI_DB_SERVICE:FREEPDB1}
    username: ${SOLIDARI_DB_USER:solidari}
    password: ${SOLIDARI_DB_PASSWORD:solidari}
    driver-class-name: oracle.jdbc.OracleDriver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

solidari:
  jwt:
    secret: chave-de-teste-nao-usar-em-producao-0123456789
    expiracao-minutos: 60
