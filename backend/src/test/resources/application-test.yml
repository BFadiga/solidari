spring:
  datasource:
    url: jdbc:postgresql://${SOLIDARI_DB_HOST:localhost}:${SOLIDARI_DB_PORT:5432}/${SOLIDARI_DB_NAME:solidari}?escapeSyntaxCallMode=call
    username: ${SOLIDARI_DB_USER:solidari}
    password: ${SOLIDARI_DB_PASSWORD:solidari}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate

solidari:
  jwt:
    secret: chave-de-teste-nao-usar-em-producao-0123456789
    expiracao-minutos: 60
