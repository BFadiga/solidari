server:
  port: 8080

spring:
  application:
    name: solidari-backend
  datasource:
    # Oracle Database Free (Docker) por padrao. Para o Oracle da FIAP use, por exemplo:
    #   SOLIDARI_DB_HOST=oracle.fiap.com.br SOLIDARI_DB_SERVICE=ORCL
    #   SOLIDARI_DB_USER=rmXXXXX SOLIDARI_DB_PASSWORD=<sua senha>
    url: jdbc:oracle:thin:@//${SOLIDARI_DB_HOST:localhost}:${SOLIDARI_DB_PORT:1521}/${SOLIDARI_DB_SERVICE:FREEPDB1}
    username: ${SOLIDARI_DB_USER:solidari}
    password: ${SOLIDARI_DB_PASSWORD:solidari}
    driver-class-name: oracle.jdbc.OracleDriver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

solidari:
  jwt:
    secret: ${SOLIDARI_JWT_SECRET:mude-esta-chave-em-producao-0123456789abcdef}
    expiracao-minutos: 1440
