server:
  port: 8080

spring:
  application:
    name: solidari-backend
  datasource:
    url: jdbc:h2:file:./data/solidari;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html

solidari:
  jwt:
    # Em produção, sobrescrever via variável de ambiente SOLIDARI_JWT_SECRET.
    secret: ${SOLIDARI_JWT_SECRET:mude-esta-chave-em-producao-0123456789abcdef}
    expiracao-minutos: 1440
