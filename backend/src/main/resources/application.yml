server:
  port: 8080

spring:
  application:
    name: solidari-backend
  datasource:
    url: jdbc:postgresql://${SOLIDARI_DB_HOST:localhost}:${SOLIDARI_DB_PORT:5432}/${SOLIDARI_DB_NAME:solidari}?escapeSyntaxCallMode=call
    username: ${SOLIDARI_DB_USER:solidari}
    password: ${SOLIDARI_DB_PASSWORD:solidari}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

solidari:
  jwt:
    secret: ${SOLIDARI_JWT_SECRET:mude-esta-chave-em-producao-0123456789abcdef}
    expiracao-minutos: 1440
